plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'app.xingshu.installer'
    compileSdk 35
    defaultConfig {
        applicationId 'app.xingshu.installer'
        minSdk 26
        targetSdk 35
        versionCode 2026112603
        versionName '0.2.2'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures { aidl true; buildConfig true; compose true }
    buildTypes { release { minifyEnabled false } }
    packaging {
        resources {
            excludes += [
                'org/bouncycastle/pqc/**',
                'META-INF/versions/**'
            ]
        }
    }
    // Published APKs already use the signed feed's date sequence; renumbering would prevent upgrades.
    // The shared update protocol caps it at 2,100,000,000, below Android's signed integer limit.
    lint { warning 'HighAppVersionCode' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main {
        java.srcDir "$buildDir/generated/payload/java"
        assets.srcDir "$buildDir/generated/payload/assets"
    }
}
dependencies {
    implementation project(':localadb')
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    testImplementation 'junit:junit:4.13.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
